<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agente PR - NTT DATA Perú</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f9f8f6; --surface: #ffffff; --border: #e5e3de;
      --border-strong: #ccc9c2; --text: #1a1916; --text-sec: #6b6860;
      --text-ter: #9c9a95; --accent: #1a1916; --accent-fg: #ffffff;
      --green-bg: #eaf5ee; --green-text: #1a5c30;
      --blue-bg: #e8f0fb; --blue-text: #1a3a6b;
      --gray-bg: #f1f0ec; --gray-text: #5a5850;
      --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem 1rem 4rem; }
    .container { max-width: 960px; margin: 0 auto; }
    header { margin-bottom: 2rem; display: flex; align-items: center; gap: 16px; }
    header img { height: 36px; width: auto; }
    header div h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; margin-bottom: 4px; }
    header div p { font-size: 13px; color: var(--text-sec); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 1.5rem; margin-bottom: 1rem; }
    .field-label { display: block; font-size: 13px; font-weight: 500; color: var(--text-sec); margin-bottom: 8px; }
    textarea { width: 100%; min-height: 80px; resize: vertical; font-size: 14px; font-family: 'DM Sans', sans-serif; border: 1px solid var(--border); border-radius: var(--r-md); padding: 10px 12px; color: var(--text); background: var(--bg); transition: border-color .15s; }
    textarea:focus { outline: none; border-color: var(--border-strong); }
    .scope-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); align-items: center; }
    .scope-label { font-size: 12px; font-weight: 500; color: var(--text-sec); }
    .scope-chip { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--text-sec); cursor: pointer; user-select: none; }
    .scope-chip input { cursor: pointer; accent-color: var(--accent); }
    .controls { display: flex; align-items: center; gap: 10px; margin-top: 1rem; flex-wrap: wrap; }
    .btn-primary { background: var(--accent); color: var(--accent-fg); border: none; border-radius: var(--r-md); padding: 9px 20px; font-size: 14px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; display: flex; align-items: center; gap: 7px; transition: opacity .15s; }
    .btn-primary:hover { opacity: .82; }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
    .btn-sec { background: transparent; border: 1px solid var(--border-strong); border-radius: var(--r-md); padding: 9px 16px; font-size: 13px; font-family: 'DM Sans', sans-serif; color: var(--text); cursor: pointer; transition: background .15s; }
    .btn-sec:hover { background: var(--bg); }
    .btn-green { background: #1a5c30; color: #fff; border: none; border-radius: var(--r-md); padding: 9px 20px; font-size: 14px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; display: flex; align-items: center; gap: 7px; transition: opacity .15s; }
    .btn-green:hover { opacity: .85; }
    .toggle-label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-sec); cursor: pointer; margin-left: auto; }
    .toggle-label input { cursor: pointer; accent-color: var(--accent); }
    .media-panel { background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-md); padding: 1rem; margin-bottom: 1rem; display: none; }
    .media-panel.open { display: block; }
    .media-panel-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .media-panel-hdr span { font-size: 13px; color: var(--text-sec); }
    .btn-xs { background: transparent; border: 1px solid var(--border-strong); border-radius: var(--r-sm); padding: 3px 10px; font-size: 12px; font-family: 'DM Sans', sans-serif; color: var(--text); cursor: pointer; }
    .btn-xs:hover { background: var(--surface); }
    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 7px; }
    .media-item { display: flex; align-items: center; gap: 7px; font-size: 13px; cursor: pointer; user-select: none; }
    .media-item input { cursor: pointer; accent-color: var(--accent); flex-shrink: 0; }
    .status { font-size: 13px; color: var(--text-sec); min-height: 22px; margin-bottom: 12px; }
    .prog { color: #185FA5; font-weight: 500; }
    .confirm-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 1.25rem; margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .confirm-box p { font-size: 14px; font-weight: 500; }
    .confirm-box span { font-size: 13px; color: var(--text-sec); display: block; margin-top: 3px; }
    .results-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
    .results-hdr h2 { font-size: 15px; font-weight: 600; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; }
    .b-web { background: var(--green-bg); color: var(--green-text); }
    .b-miss { background: var(--gray-bg); color: var(--gray-text); }
    .table-wrap { border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; margin-bottom: 1rem; }
    table { width: 100%; border-collapse: collapse; }
    thead { background: var(--bg); }
    th { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-ter); padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    td { font-size: 13px; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; word-break: break-word; }
    tr:last-child td { border-bottom: none; }
    tr.found:hover td { background: var(--bg); }
    td a { color: #185FA5; text-decoration: none; }
    td a:hover { text-decoration: underline; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
    .dot-web { background: #1D9E75; }
    .dot-miss { background: #B4B2A9; }
    .src-tag { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 20px; white-space: nowrap; background: var(--green-bg); color: var(--green-text); }
    .src-tag.social { background: var(--blue-bg); color: var(--blue-text); }
    .missing-section { margin-top: 1.5rem; }
    .missing-section h3 { font-size: 13px; font-weight: 500; color: var(--text-sec); margin-bottom: 10px; }
    .missing-tags { display: flex; flex-wrap: wrap; gap: 7px; }
    .missing-tag { font-size: 12px; color: var(--text-sec); background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 3px 11px; }
    .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--accent-fg); border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="container">
  <header>
    <img src="/logo.png" alt="NTT DATA Perú">
    <div>
      <h1>Agente PR — NTT DATA Perú</h1>
      <p>Busca notas de prensa en web y redes sociales (vía Google) · <strong>18 medios prioritarios</strong></p>
    </div>
  </header>

  <div class="card">
    <label class="field-label" for="query">Tema, evento o nota de prensa</label>
    <textarea id="query" placeholder="Ej: NTT DATA reúne a más de 1,500 líderes en el Digital & AI Summit Lima 2026..."></textarea>
    <div class="scope-row">
      <span class="scope-label">Buscar en:</span>
      <label class="scope-chip"><input type="checkbox" id="sc-web" checked> Web directa</label>
      <label class="scope-chip"><input type="checkbox" id="sc-google" checked> Google</label>
      <label class="scope-chip"><input type="checkbox" id="sc-x" checked> X</label>
      <label class="scope-chip"><input type="checkbox" id="sc-li" checked> LinkedIn</label>
      <label class="scope-chip"><input type="checkbox" id="sc-fb" checked> Facebook</label>
      <label class="scope-chip"><input type="checkbox" id="sc-ig" checked> Instagram</label>
      <label class="scope-chip"><input type="checkbox" id="sc-yt" checked> YouTube</label>
    </div>
    <div class="controls">
      <button class="btn-primary" id="btn-search" onclick="startSearch()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        Buscar en medios
      </button>
      <button class="btn-sec" onclick="clearAll()">Limpiar</button>
      <label class="toggle-label">
        <input type="checkbox" id="toggle-media" onchange="toggleMediaPanel()"> Ver / editar medios
      </label>
    </div>
  </div>

  <div class="media-panel" id="media-panel">
    <div class="media-panel-hdr">
      <span id="media-count">18 medios seleccionados</span>
      <div style="display:flex;gap:8px;">
        <button class="btn-xs" onclick="selectAll()">Todos</button>
        <button class="btn-xs" onclick="selectNone()">Ninguno</button>
      </div>
    </div>
    <div class="media-grid" id="media-grid"></div>
  </div>

  <div class="status" id="status"></div>
  <div id="confirm-area"></div>
  <div id="results-area"></div>
</div>

<script>
const MEDIOS = [
  {name:"América Sistemas",     domain:"americasistemas.pe",         tier:3, value:1200, reach:50000,  searchUrl:"https://www.americasistemas.pe/?s={keyword}"},
  {name:"Business Empresarial", domain:"businessempresarial.com.pe", tier:1, value:2400, reach:80000,  searchUrl:"https://www.businessempresarial.com.pe/?s={keyword}"},
  {name:"Channel News Perú",    domain:"channelnewsperu.com",        tier:2, value:2200, reach:60000,  searchUrl:"https://channelnewsperu.com/?s={keyword}"},
  {name:"Ciudad.pe",            domain:"ciudad.pe",                  tier:3, value:1200, reach:10000,  searchUrl:"https://ciudad.pe/?s={keyword}"},
  {name:"Common Digital",       domain:"commondigital.pe",           tier:3, value:1200, reach:10000,  searchUrl:"https://commondigital.pe/?s={keyword}"},
  {name:"Comunicación A1",      domain:"comunicaciona1.com",         tier:3, value:600,  reach:8000,   searchUrl:"https://comunicaciona1.com/?s={keyword}"},
  {name:"Comunidaria",          domain:"comunidaria.com",            tier:2, value:600,  reach:8000,   searchUrl:"https://comunidaria.com/?s={keyword}"},
  {name:"CSTIC",                domain:"blog.cstictv.com",           tier:3, value:1200, reach:15000,  searchUrl:"https://blog.cstictv.com/?s={keyword}"},
  {name:"CTO Perú",             domain:"ctoperu.com",                tier:1, value:3500, reach:75000,  searchUrl:"https://ctoperu.pe/?s={keyword}"},
  {name:"Diario Gestión",       domain:"gestion.pe",                 tier:1, value:5310, reach:66000,  searchUrl:"https://gestion.pe/buscar/{keyword}/todas/descendiente/?query={keyword}"},
  {name:"Ecos Digitales",       domain:"ecosdigitales.pe",           tier:2, value:1000, reach:10000,  searchUrl:"https://ecosdigitales.pe/?s={keyword}"},
  {name:"Enterados.pe",         domain:"enterados.pe",               tier:2, value:1000, reach:20000,  searchUrl:"https://enterados.pe/?s={keyword}"},
  {name:"Expreso",              domain:"expreso.com.pe",             tier:1, value:3500, reach:80000,  searchUrl:"https://www.expreso.com.pe/?s={keyword}"},
  {name:"JC Magazine",          domain:"jcmagazine.com",             tier:3, value:1800, reach:5000,   searchUrl:"https://jcmagazine.com/?s={keyword}"},
  {name:"Minería y Energía",    domain:"mineriaenergia.com",         tier:1, value:6000, reach:120000, searchUrl:"https://mineriaenergia.com/?s={keyword}"},
  {name:"Press Perú",           domain:"pressperu.com",              tier:2, value:1000, reach:15000,  searchUrl:"https://pressperu.com/?s={keyword}"},
  {name:"Revista Economía",     domain:"revistaeconomia.com",        tier:2, value:1500, reach:20000,  searchUrl:"https://revistaeconomia.com/?s={keyword}"},
  {name:"Tecnología 21",        domain:"tecnologia21.pe",            tier:1, value:2200, reach:75000,  searchUrl:"https://t21.pe/?s={keyword}"},
];

const MEDIO_REF = {};
MEDIOS.forEach(m => { MEDIO_REF[m.name] = m; MEDIO_REF[m.domain] = m; });

let selected = new Set(MEDIOS.map(m=>m.domain));
let results = [];
let running = false;

function buildGrid(){
  document.getElementById('media-grid').innerHTML = MEDIOS.map(m=>`
    <label class="media-item">
      <input type="checkbox" value="${m.domain}" checked onchange="updateSel(this)">
      ${m.name}
    </label>`).join('');
  updateCount();
}

function updateSel(cb){ cb.checked ? selected.add(cb.value) : selected.delete(cb.value); updateCount(); }
function updateCount(){ document.getElementById('media-count').textContent = selected.size+' medios seleccionados'; }
function selectAll(){ document.querySelectorAll('#media-grid input').forEach(cb=>{cb.checked=true;selected.add(cb.value);}); updateCount(); }
function selectNone(){ document.querySelectorAll('#media-grid input').forEach(cb=>{cb.checked=false;selected.delete(cb.value);}); updateCount(); }
function toggleMediaPanel(){ document.getElementById('media-panel').classList.toggle('open', document.getElementById('toggle-media').checked); }
function setStatus(html){ document.getElementById('status').innerHTML = html; }
function clearAll(){
  document.getElementById('query').value='';
  document.getElementById('status').innerHTML='';
  document.getElementById('results-area').innerHTML='';
  document.getElementById('confirm-area').innerHTML='';
  results=[];
}

function getScopeFlags(){
  return {
    web:    document.getElementById('sc-web').checked,
    google: document.getElementById('sc-google').checked,
    x:      document.getElementById('sc-x').checked,
    li:     document.getElementById('sc-li').checked,
    fb:     document.getElementById('sc-fb').checked,
    ig:     document.getElementById('sc-ig').checked,
    yt:     document.getElementById('sc-yt').checked
  };
}

function extractKeyword(query){
  const q = query.toLowerCase();
  if(q.includes('summit')) return 'summit';
  if(q.includes('blockchain') || q.includes('darshana')) return 'darshana';
  if(q.includes('talent') || q.includes('trujillo')) return 'talent';
  return 'ntt';
}

function buildPrompt(medios, query, scope){
  const keyword = extractKeyword(query);
  const sociales = [
    scope.x  && {label:'X',        site:'x.com'},
    scope.li && {label:'LinkedIn', site:'linkedin.com'},
    scope.fb && {label:'Facebook', site:'facebook.com'},
    scope.ig && {label:'Instagram',site:'instagram.com'},
    scope.yt && {label:'YouTube',  site:'youtube.com'}
  ].filter(Boolean);

  const mediosList = medios.map(m => {
    const searchUrl = scope.web ? m.searchUrl.replace(/{keyword}/g, keyword) : null;
    return `- ${m.name} (${m.domain})${searchUrl ? ` → búsqueda directa: ${searchUrl}` : ''}`;
  }).join('\n');

  const googleInstr = scope.google ? `\nBÚSQUEDA EN GOOGLE: Para cada medio usa:\n- site:[dominio] [palabras clave principales]\n- site:[dominio] [nombre empresa o evento]\n- site:[dominio] [keywords alternativos]` : '';

  const socialInstr = sociales.length ? `\nBÚSQUEDA EN REDES SOCIALES vía Google:\n${sociales.map(s=>`- ${s.label}: "[nombre del medio]" "${keyword}" site:${s.site}`).join('\n')}` : '';

  const webInstr = scope.web ? `\nBÚSQUEDA DIRECTA EN WEB: Accede a las URLs de búsqueda directa indicadas para cada medio y revisa los resultados. Busca notas publicadas sobre el tema en el período reciente.` : '';

  return `Eres un asistente especializado en clipping de medios peruanos. Busca notas de prensa publicadas sobre este tema:

TEMA: "${query}"
KEYWORD DE BÚSQUEDA: "${keyword}"

MEDIOS A REVISAR:
${mediosList}
${webInstr}
${googleInstr}
${socialInstr}

Responde SOLO con JSON válido, sin texto ni backticks adicionales:
[
  {
    "medio": "Nombre del medio",
    "dominio": "dominio.com",
    "hallazgos": [
      {
        "fuente": "web|x|linkedin|facebook|instagram|youtube",
        "encontrado": true,
        "titulo": "Título exacto o null",
        "url": "URL completa o null",
        "fecha": "DD/MM/YYYY o null"
      }
    ]
  }
]

Reglas:
- Un objeto por cada medio de la lista
- En hallazgos, una entrada por cada fuente donde encontraste algo
- Si no encontraste nada, un solo hallazgo con encontrado:false
- Solo marca encontrado:true si puedes confirmar con URL real
- Sé honesto: si no puedes confirmar, marca encontrado:false`;
}

async function startSearch(){
  const query = document.getElementById('query').value.trim();
  if(!query){ setStatus('Escribe un tema o evento antes de buscar.'); return; }
  if(selected.size===0){ setStatus('Selecciona al menos un medio.'); return; }
  if(running) return;

  running=true; results=[];
  document.getElementById('btn-search').disabled=true;
  document.getElementById('results-area').innerHTML='';
  document.getElementById('confirm-area').innerHTML='';

  const scope = getScopeFlags();
  const medios = MEDIOS.filter(m=>selected.has(m.domain));

  setStatus(`<span class="prog"><span class="spinner"></span> Consultando ${medios.length} medios (web directa + Google + redes)...</span>`);

  try {
    const resp = await fetch('/api/search', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({prompt: buildPrompt(medios, query, scope)})
    });
    const data = await resp.json();
    const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    const clean = text.replace(/```json|```/g,'').trim();
    const match = clean.match(/\[[\s\S]*\]/);
    if(match) results = JSON.parse(match[0]);
  } catch(e) {
    setStatus('Error de conexión: ' + e.message);
    running=false;
    document.getElementById('btn-search').disabled=false;
    return;
  }

  renderResults(query);
  running=false;
  document.getElementById('btn-search').disabled=false;
}

function renderResults(query){
  const allFound=[], notFound=[];
  results.forEach(r=>{
    const hits=(r.hallazgos||[]).filter(h=>h.encontrado);
    if(hits.length) hits.forEach(h=>allFound.push({medio:r.medio, dominio:r.dominio, ...h}));
    else notFound.push(r);
  });

  setStatus(`Búsqueda completada — <strong>${allFound.length}</strong> notas encontradas en <strong>${results.length}</strong> medios consultados.`);

  if(allFound.length > 0){
    document.getElementById('confirm-area').innerHTML = `
      <div class="confirm-box">
        <div>
          <p>¿Generar reporte de prensa?</p>
          <span>Se creará un Excel con ${allFound.length} nota(s) lista(s) para tu reporte mensual.</span>
        </div>
        <button class="btn-green" onclick="generarReporte()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Generar reporte Excel
        </button>
      </div>`;
  }

  let html=`<div class="results-hdr">
    <h2>${query.length>70?query.substring(0,70)+'…':query}</h2>
    <div class="badges">
      <span class="badge b-web"><span class="dot dot-web"></span>${allFound.length} encontradas</span>
      <span class="badge b-miss"><span class="dot dot-miss"></span>${notFound.length} sin nota</span>
    </div>
  </div>`;

  if(allFound.length){
    html+=`<div class="table-wrap"><table><thead><tr>
      <th style="width:18%">Medio</th>
      <th style="width:10%">Fuente</th>
      <th style="width:36%">Título</th>
      <th style="width:24%">URL</th>
      <th style="width:12%">Fecha</th>
    </tr></thead><tbody>`;
    allFound.forEach(h=>{
      const isWeb = h.fuente==='web';
      const fuenteLabel = isWeb ? 'Web' : h.fuente.charAt(0).toUpperCase()+h.fuente.slice(1);
      html+=`<tr class="found">
        <td style="font-weight:500;">${h.medio}</td>
        <td><span class="src-tag${isWeb?'':' social'}">${fuenteLabel}</span></td>
        <td style="color:#6b6860;">${h.titulo||'—'}</td>
        <td>${h.url?`<a href="${h.url}" target="_blank" rel="noopener">↗ Ver</a>`:'—'}</td>
        <td style="color:#9c9a95;white-space:nowrap;">${h.fecha||'—'}</td>
      </tr>`;
    });
    html+=`</tbody></table></div>`;
  }

  if(notFound.length){
    html+=`<div class="missing-section"><h3>Sin nota encontrada en:</h3>
      <div class="missing-tags">${notFound.map(r=>`<span class="missing-tag">${r.medio}</span>`).join('')}</div>
    </div>`;
  }

  document.getElementById('results-area').innerHTML=html;
}

function parseFecha(fechaStr){
  if(!fechaStr) return null;
  const parts = fechaStr.split('/');
  if(parts.length===3){
    const d=parseInt(parts[0]), m=parseInt(parts[1])-1, y=parseInt(parts[2]);
    return new Date(y,m,d);
  }
  return null;
}

function generarReporte(){
  const allFound=[];
  results.forEach(r=>{
    (r.hallazgos||[]).filter(h=>h.encontrado).forEach(h=>{
      allFound.push({medio:r.medio, dominio:r.dominio, ...h});
    });
  });

  const rows = allFound.map(h => {
    const info = MEDIO_REF[h.medio] || MEDIO_REF[h.dominio] || {tier:'', value:'', reach:''};
    const fecha = parseFecha(h.fecha);
    return {
      'Scope':   '',
      'Country': 'Perú',
      'Date':    fecha ? fecha : (h.fecha||''),
      'Format':  'Web',
      'Media':   h.medio,
      'Title':   h.titulo||'',
      'Link':    h.url||'',
      'Unique/Include others/Repost': 'Unique',
      'Tier':    info.tier||'',
      'Value (ROI)': info.value||'',
      'Reach':   info.reach||'',
      'Theme':   '',
      'Subtheme':'',
      'Reference':'',
    };
  });

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(rows, {
    header: ['Scope','Country','Date','Format','Media','Title','Link','Unique/Include others/Repost','Tier','Value (ROI)','Reach','Theme','Subtheme','Reference']
  });

  rows.forEach((r, i) => {
    const cellRef = 'C' + (i+2);
    if(ws[cellRef] && r['Date'] instanceof Date){
      ws[cellRef].t = 'd';
      ws[cellRef].v = r['Date'];
      ws[cellRef].z = 'DD/MM/YYYY';
    }
  });

  ws['!cols'] = [
    {wch:8},{wch:8},{wch:12},{wch:8},{wch:22},{wch:50},{wch:40},
    {wch:10},{wch:6},{wch:12},{wch:12},{wch:14},{wch:14},{wch:14}
  ];

  XLSX.utils.book_append_sheet(wb, ws, 'Notas');
  const mes = new Date().toLocaleString('es-PE',{month:'long',year:'numeric'}).replace(' de ',' ');
  XLSX.writeFile(wb, `Reporte_NP_${mes}.xlsx`);

  document.getElementById('confirm-area').innerHTML = `
    <div class="confirm-box">
      <div>
        <p>✓ Reporte generado correctamente</p>
        <span>${allFound.length} nota(s) exportadas. Revisa tu carpeta de descargas.</span>
      </div>
      <button class="btn-sec" onclick="generarReporte()">Descargar de nuevo</button>
    </div>`;
}

buildGrid();
</script>
</body>
</html>
